<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vettore · Liquidaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

:root{--bg:#070b14;--panel:#0b1120;--side:#0d1424;--card:#0f172a;--line:#1e293b;--line2:#2a3850;--txt:#e5e9f2;--mut:#8b96ab;--mut2:#64708a;--blue:#2563eb;--blue2:#3b82f6;--green:#22c55e;--greenbg:#052e1a;--orange:#f59e0b;--red:#ef4444;--redbg:#2a0d10}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:244px;flex:0 0 244px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.logo{background:#fff;color:#0b2a6b;font-weight:800;font-style:italic;padding:5px 10px;border-radius:10px;font-size:15px}
.search{display:flex;align-items:center;gap:8px;background:#0a101d;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;color:var(--mut)}
.search input{background:transparent;border:0;outline:0;width:100%}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#cbd3e1;font-size:14px}
.nav small{margin-left:auto;font-size:10.5px;color:#4f6a9a;white-space:nowrap}
.nav.active{background:var(--blue);color:#fff}
.nav svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.sub{margin:2px 0 6px 20px;border-left:1px solid var(--line);padding-left:8px;display:flex;flex-direction:column;gap:2px}
.sub a{padding:8px 10px;border-radius:8px;color:var(--mut);font-size:12.5px;cursor:pointer}
.sub a.on{background:#131d33;color:#fff;font-weight:600}
.sub .grp{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 2px}
.newtag{font-size:9.5px;background:var(--orange);color:#111;border-radius:6px;padding:1px 5px;font-weight:700}
.main{flex:1;min-width:0}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 24px;gap:14px;color:var(--mut);font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:9px;margin-right:6px;background:var(--mut2)}
.dot.ok{background:var(--green)} .dot.busy{background:var(--orange)} .dot.off{background:var(--red)}
.content{padding:22px 22px 70px;max-width:1500px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.badge{background:#fff;color:#111;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;background:#0b1120;border:1px solid var(--line2);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#3b4b68;background:#101a2e}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue2)}
.btn.green{background:#15803d;border-color:#15803d;color:#fff}
.btn.warn{color:var(--orange)} .btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{background:#131c2e;border:0;border-radius:8px;padding:9px 13px;font-weight:600;font-size:13.5px;cursor:pointer;color:#d6dcea}
.tab.on{background:#f3f4f6;color:#0b1120}
.tab .n{display:inline-block;background:#2a3850;color:#fff;border-radius:5px;font-size:11px;padding:0 5px;margin-right:6px}
.tab.on .n{background:#0b1120}
select,input[type=text],input[type=number],input[type=date],textarea{background:#060a14;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none}
select:focus,input:focus{border-color:var(--blue2)}
input.bad{border-color:var(--red)!important;background:#1c0a0d}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h3{margin:0;font-size:14px}
.cb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--mut);font-size:12px;margin-bottom:6px}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mut2);font-size:11.5px;margin-top:4px;line-height:1.5}
.alert{border:1px solid #6b4a0c;background:#1c1405;color:#fcd68a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.alert.err{border-color:#7f1d1d;background:var(--redbg);color:#fca5a5}
.alert.ok{border-color:#14532d;background:#04170d;color:#86efac}
.alert.info{border-color:#1e3a8a;background:#0a1430;color:#bfd2ff}
.alert b{color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:200px}
.pill{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:#d6dcea}
.pill.on{background:#f3f4f6;color:#0b1120;border-color:#f3f4f6}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th{text-align:left;color:#c3cbd9;font-weight:600;font-size:12.5px;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#0d1426;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:hover td{background:#0e1628}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ded{color:#fca5a5}.neg{color:var(--red);font-weight:700}.pos{color:#86efac}
.zero{color:var(--mut2)}
tfoot td{font-weight:700;background:#0d1426;border-top:1px solid var(--line2)}
tr.grp td{background:#1a2b45;font-weight:600;color:#f1f5fb;border-top:2px solid #2f4568}
tr.grp td:first-child{box-shadow:inset 3px 0 0 #3b82f6}
tr.grp:hover td{background:#203352}
tr.naf-line td{background:#080d16;color:var(--mut);font-size:12px}
tr.naf-line td:first-child{padding-left:28px}
.naf-more{display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:#9fb4d8;font-size:11.5px;font-weight:500;cursor:pointer;background:none;border:0;padding:0;vertical-align:middle}
.naf-more:hover{color:#fff;text-decoration:underline}
.naf-more .chev{display:inline-block;transition:transform .15s;font-size:10px}
.naf-more.open .chev{transform:rotate(90deg)}
.name{font-weight:600}
.subt{color:var(--mut);font-size:11.5px;margin-top:2px}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line2);color:#b9c3d6;border-radius:6px;padding:1px 6px;font-weight:500;white-space:nowrap}
.chip.g{color:#86efac;border-color:#14532d;background:var(--greenbg)}
.chip.w{color:#fcd68a;border-color:#6b4a0c;background:#1c1405}
.chip.r{color:#fca5a5;border-color:#7f1d1d;background:var(--redbg)}
.chip.b{color:#bfd2ff;border-color:#1e3a8a;background:#0a1430}
.lnk{color:#9fb4d8;cursor:pointer;font-size:12.5px;background:none;border:0;padding:0}
.lnk:hover{color:#fff;text-decoration:underline}
.lnk.r{color:var(--red)}
input.money{width:125px;text-align:right;padding:6px 8px}
input.sm{width:72px;text-align:right;padding:6px 8px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
.drop{border:1.5px dashed #33445f;border-radius:12px;padding:20px;text-align:center;color:var(--mut);background:#0a101d;cursor:pointer}
.drop.hov{border-color:var(--blue2);background:#0d1a33;color:#fff}
.drop b{color:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.mut{color:var(--mut)} .small{font-size:12px}
.legend{font-size:12px;color:var(--mut);line-height:1.6;margin:10px 2px}
code{background:#111a2c;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
.bar{height:6px;background:#1b263a;border-radius:9px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue2)}
/* stepper */
.stepper{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.stp{flex:1;padding:12px 12px;cursor:pointer;border-right:1px solid var(--line);display:flex;gap:10px;align-items:center;min-width:0}
.stp:last-child{border-right:0}
.stp .c{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:1.5px solid var(--line2);flex:0 0 26px;color:var(--mut)}
.stp .t{font-size:12.5px;font-weight:600;line-height:1.25}
.stp .t small{display:block;font-weight:400;color:var(--mut2);font-size:11px}
.stp.done .c{background:#14532d;border-color:#22c55e;color:#bbf7d0}
.stp.cur{background:#122040}
.stp.cur .c{border-color:var(--blue2);color:#fff;background:var(--blue)}
.stp.lock{cursor:not-allowed;opacity:.45}
.stepfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(2,6,14,.6);z-index:20;display:none}.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(740px,96vw);background:#0a1020;border-left:1px solid var(--line2);z-index:21;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.db{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec .sh{display:flex;justify-content:space-between;padding:10px 14px;background:#0d1426;font-weight:600;font-size:13px}
.sec td,.sec th{padding:7px 14px;font-size:12.5px}
.sec th{position:static;background:transparent}
.empty{padding:12px 14px;color:var(--mut2);font-size:12.5px}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:14px;border:1px solid var(--line2);border-radius:12px;background:#0d1426;font-variant-numeric:tabular-nums}
.tot .big{font-size:18px;font-weight:700}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;line-height:1;margin-left:auto}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(2,6,14,.65);padding:16px}
.modal.on{display:flex}
.mbox{background:#0b1222;border:1px solid var(--line2);border-radius:14px;width:min(560px,100%);max-height:92vh;overflow:auto}
.mbox.wide{width:min(860px,100%)}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
.mb{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb .full{grid-column:1/-1}
.mb label.f{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}
.mb .full>input,.mb .full>select,.mb>div>input,.mb>div>select{width:100%}
.mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.hint{color:var(--mut2);font-size:11.5px;margin-top:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111c33;border:1px solid var(--line2);padding:11px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
.loading{padding:60px;text-align:center;color:var(--mut)}
.chg{font-size:11px;margin-left:6px}
.matrix td.n{min-width:100px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.side{display:none}.stp .t small{display:none}}

.role{display:flex;gap:4px;background:#0a101d;border:1px solid var(--line2);border-radius:9px;padding:3px}
.role button{background:none;border:0;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.role button.on{background:#f3f4f6;color:#0b1120}
.plan td{padding:6px 8px}
.plan select,.plan input{padding:6px 8px}
tr.closed td{background:#08130e}
tr.sel td{background:#101c36}
.secbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.secbox .sh{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#0d1426;font-weight:600;font-size:13.5px}
.secbox td,.secbox th{padding:8px 14px;font-size:12.5px}
.secbox th{position:static;background:transparent}
tr.off td{opacity:.45;text-decoration:line-through}
tr.off td:first-child{opacity:1;text-decoration:none}
.paybox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;padding:14px;border:1px solid var(--line2);border-radius:12px;margin-top:12px}
.paybox label{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}
.status{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.status .it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center}

/* Integración Mi Vettore: menú de la app afuera; acá solo contenido.
   Sin scroll interno: el panel de Mi Vettore scrollea una sola vez. */
.side{display:none!important}
.tabs,#tabs{display:none!important}
html,body{margin:0;height:auto!important;min-height:0;overflow:visible!important;background:var(--bg);position:relative}
.app{display:block;min-height:0;height:auto!important}
.main{display:block;min-width:0;min-height:0;height:auto!important}
.topbar{height:36px;padding:0 12px}
.content{overflow:visible;padding:10px 12px 88px;max-width:none;width:100%;box-sizing:border-box}
.head{gap:8px;margin-bottom:12px}
.head h1{font-size:18px}
.toolbar{gap:8px;flex-wrap:wrap}
.toolbar .grow{min-width:140px}
/* Tablas: solo scroll horizontal (evita 2ª barra vertical). */
.tw{max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.role[data-locked="1"]{display:none!important}
@media (max-width:900px){
  .content{padding:8px 8px 96px}
  .topbar{height:32px;padding:0 8px;font-size:11px}
  .head h1{font-size:16px}
  .btn,.pill,.tab{font-size:12px;padding:8px 10px}
  .btn.sm{padding:6px 8px;font-size:11px}
  .toolbar .grow{min-width:100%;flex:1 1 100%}
  .toolbar select{max-width:100%}
  th,td{padding:8px 8px;font-size:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .grid2{grid-template-columns:1fr}
  .stepper{flex-direction:column}
  .stp{border-right:0;border-bottom:1px solid var(--line)}
  .drop{padding:14px}
}

</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">VETTORE</span><b>Mi Vettore</b></div>
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Buscar patente, DNI..."></div>
    <div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Ficha integral (ABM)<small>Flota</small></div>
    <div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20L12 3z"/></svg>Inhabilitaciones<small>Seguimiento</small></div>
    <div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Documentación<small>Unidades</small></div>
    <div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4z"/></svg>Talleres<small>Circuito</small></div>
    <div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Mantenimiento<small>Km</small></div>
    <div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>Alertas de vencimiento<small>M4</small></div>
    <div class="nav active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></svg>Liquidaciones<small><span class="newtag">NUEVO</span></small></div>
    <div class="sub" id="subnav"></div>
  </aside>
  <main class="main">
    <div class="topbar"><span id="saveSt"><span class="dot busy"></span>Conectando…</span><div class="role" id="role"></div></div>
    <div class="content">
      <div class="head"><span class="badge">Liquidaciones</span><h1 id="ttl">Liquidaciones</h1><div class="sp"></div><button class="btn" data-a="reset">↺ Restaurar datos de ejemplo</button></div>
      <div class="tabs" id="tabs"></div>
      <div id="view"><div class="loading">Cargando…</div></div>
    </div>
  </main>
</div>
<div class="ov" id="ov" data-a="closeDrawer"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" multiple style="display:none">

function histRecords(){
  const out={};const ps=new Set([...Object.keys(B.fact),...Object.keys(B.pagos),...Object.keys(B.cuotas)]);
  ps.forEach(p=>{if(p>=B.PEND)return;const R={};
    const get=n=>{const k=norm(n);return R[k]||(R[k]={periodo:p,k,empresa:canon(n),modo:'historico',fact:0,viajes:0,factRows:[],nafta:[],adel:[],tal:[],prest:[]})};
    (S.fact[p]||[]).forEach(f=>{const r=get(f.empresa);r.fact+=f.importe;r.viajes+=f.viajes;r.factRows.push(f)});
    (B.nafta[p]||[]).forEach(([o,pat,t,c,l,i])=>{if(!o)return;get(o).nafta.push({patente:pat,tipo:t,cargas:c,litros:l,importe:i})});
    ALLADEL.forEach(a=>a.cuotas.forEach(c=>{if(c.periodo===p)get(a.empresa).adel.push({id:a.id,n:c.n,de:a.cuotas.length,fecha:a.fecha,tipo:a.tipo,desc:a.desc,periodo:c.periodo,importe:c.importe})}));
    (B.cuotas[p]||[]).forEach(([id,emp,h,v,imp])=>{const l=B.prestamos.find(x=>x.id===id);get(emp).prest.push({id,concepto:l?l.concepto:'',horas:h,vh:v,importe:imp,total:l?l.totalHs:0})});
    const pg={};Object.entries(B.pagos[p]||{}).forEach(([n,v])=>pg[norm(n)]=v);
    Object.values(R).forEach(r=>{finish(r);const x=pg[r.k];r.ef=x?x[0]:0;r.tr=x?x[1]:0;r.fechaPago=x?x[2]:'';r.pagado=!!x;r.reg=!!x;r.dif=x?Math.round(x[0]+x[1]-Math.max(0,r.saldo)):0;r.cerrada=x?x[2]:'';out[p+'|'+r.k]=r});
  });return out;
}
function finish(r){r.naftaT=sum(r.nafta,'importe');r.gnc=sum(r.nafta.filter(n=>n.tipo==='GNC'),'importe');r.naf=r.naftaT-r.gnc;r.adelT=sum(r.adel,'importe');r.talT=sum(r.tal,'importe');r.prestT=sum(r.prest,'importe');r.desc=r.naftaT+r.adelT+r.talT+r.prestT;r.saldo=r.fact-r.desc;const vh=vhEmp(r.k,pStart(r.periodo));r.vh=vh;r.horas=vh?r.fact/vh:0;return r}
/* derived indexes */
function rebuild(){
  EI.c=null;
  NM={};const addN=n=>{if(n&&!NM[norm(n)])NM[norm(n)]=String(n).trim()};S.empresas.forEach(e=>addN(e.nombre));Object.values(S.fact).forEach(a=>a.forEach(f=>addN(f.empresa)));Object.values(S.adel).forEach(a=>addN(a.empresa));Object.values(S.tal).forEach(t=>addN(t.empresa));Object.values(S.prest).forEach(l=>addN(l.empresa));B.patentes.forEach(p=>addN(p.empresa));

  Object.values(S.liq).forEach(r=>D.rec[r.periodo+'|'+r.k]=r);
  Object.values(D.rec).forEach(r=>{['nafta','adel','tal','prest','factRows'].forEach(f=>{if(!Array.isArray(r[f]))r[f]=[]});if(r.tal.length){r.tal.forEach(t=>r.adel.push({id:t.id,n:1,de:1,fecha:t.fecha,tipo:'Taller',desc:'Taller OT - '+(t.desc||''),periodo:r.periodo,importe:t.importe}));r.tal=[];finish(r)}r.nafta.forEach(n=>(n.refs||[]).forEach(x=>D.nLiq[x]=r.periodo));r.adel.forEach(a=>D.cuotaLiq[a.id+'#'+a.n]=r.periodo);r.tal.forEach(t=>{D.talLiq[t.id]=r.periodo;D.cuotaLiq[t.id+'#1']=r.periodo});r.prest.forEach(x=>{D.loanHs[x.id]=(D.loanHs[x.id]||0)+(+x.horas||0);D.loanPer[x.id+'|'+r.periodo]=x.horas})});
  syncPrestEstados();
}
const loanAcum=l=>(+l.acum0||0)+(D.loanHs[l.id]||0);
/** Estados: Activo | Refinanciado | Finalizado (auto al completar horas). Pausado legado → Refinanciado. */
const loanFin=l=>loanAcum(l)>=(+l.totalHs||0)-0.0001;
function loanEstado(l){
  if(loanFin(l))return 'Finalizado';
  if(l.estado==='Pausado')return 'Refinanciado';
  if(l.estado==='Finalizado')return 'Activo'; // reabierto: aún no está pago
  return l.estado==='Refinanciado'?'Refinanciado':'Activo';
}
function syncPrestEstados(){
  Object.values(S.prest).forEach(l=>{
    if(l.deleted)return;
    let next=l.estado;
    if(l.estado==='Pausado')next='Refinanciado';
    if(loanFin(l))next='Finalizado';
    else if(l.estado==='Finalizado')next='Activo';
    if(next!==l.estado){l.estado=next;savePrest(l)}
  });
}

  function token(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}
  async function api(method, url, body){
    const headers={Authorization:'Bearer '+token()};
    let payload=undefined;
    if(body!==undefined){headers['Content-Type']='application/json';payload=JSON.stringify(body)}
    const res=await fetch(url,{method,headers,body:payload});
    if(res.status===401){toast('Sesión vencida: volvé a iniciar sesión');throw {code:'auth'}}
    if(!res.ok){let msg='error';try{msg=(await res.json()).error||msg}catch(e){}throw {code:msg}}
    if(res.status===204)return null;
    return res.json();
  }
  function docRef(path){
    const q='?path='+encodeURIComponent(path);
    return {
      async get(){const r=await api('GET','/api/liquidaciones/doc'+q);return {exists:!!r.exists,data:()=>r.data}},
      async set(data){await api('PUT','/api/liquidaciones/doc',{path,data});return true},
      async delete(){await api('DELETE','/api/liquidaciones/doc'+q);return true}
    };
  }
  function collection(name){
    return {
      limit(){return this},
      async get(){
        const r=await api('GET','/api/liquidaciones/collections/'+encodeURIComponent(name));
        return {docs:(r.docs||[]).map(d=>({id:d.id,data:()=>d.data}))};
      }
    };
  }
  window.__vtLiquidacionesDb={doc:docRef,collection};
  window.claude={use:async (svc)=>{
    if(svc==='db')return window.__vtLiquidacionesDb;
    if(svc==='downloads')return {
      async save({filename,data}){
        const a=document.createElement('a');

        a.download=filename||'liquidacion.xlsx';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      }
    };
    return null;
  }};
  // Rol + submódulo forzados desde la app (Administrador / Operaciones)
  try{
    const q=new URLSearchParams(location.search);
    const forced=q.get('role');
    if(forced==='admin'||forced==='operador'){
      UI.role=forced;
      window.__VT_ROLE_LOCKED__=true;
      try{localStorage.setItem('vt_role',forced)}catch(e){}
    }
    const m=q.get('mod');
    if(m&&MODS.some(x=>x[0]===m))UI.mod=m;
  }catch(e){}
  // Menú lateral de Mi Vettore ↔ pestañas del prototipo
  function notifyParentMod(k){
    try{if(parent!==window)parent.postMessage({type:'vt-liq-mod',mod:k},'*')}catch(e){}
  }
  window.addEventListener('message',ev=>{
    const d=ev&&ev.data;if(!d||d.type!=='vt-liq-mod'||!d.mod)return;
    if(!MODS.some(x=>x[0]===d.mod)||UI.mod===d.mod)return;

    try{closeDrawer();document.getElementById('modal').classList.remove('on')}catch(e){}
    render();scrollTo(0,0);
  });
  window.__vtNotifyLiqMod=notifyParentMod;
})();

/** ABM: solo habilitadas + inhabilitadas (activo). NO inactivas. */
async function syncEmpresasAbm(){
  try{
    const token=(function(){try{return localStorage.getItem('mi-vettore-token')||''}catch(e){return ''}})();
    if(!token)return;
    const res=await fetch('/api/liquidaciones/empresas',{headers:{Authorization:'Bearer '+token}});
    if(!res.ok)return;
    const data=await res.json();
    const items=Array.isArray(data.items)?data.items:[];
    if(!items.length)return;
    const prev=Object.fromEntries(S.empresas.map(e=>[norm(e.nombre),e]));
    const seen=new Set();
    const merged=[];
    items.forEach(x=>{
      const nombre=String(x.nombre||'').trim();if(!nombre)return;
      const k=norm(nombre);if(seen.has(k))return;seen.add(k);
      const p=prev[k];
      merged.push({
        nombre:p?.nombre||nombre,
        // División y tipo vienen del ABM (fuente de verdad).
        division:x.division||p?.division||'',
        banco:x.banco||p?.banco||'',
        tipoTransferencia:x.tipoTransferencia||p?.tipoTransferencia||'',
        id:x.id||p?.id,
        inhabilitada:!!x.inhabilitada,
        abm:true
      });
    });
    // No mezclar seed/históricas inactivas: el desplegable (Adelantos, etc.) es solo ABM activo.
    merged.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'}));
    S.empresas=merged;EI.c=null;
    // Catálogos desde API (fuente de verdad para ABM empresas).
    try{
      const cres=await fetch('/api/liquidaciones/catalogos',{headers:{Authorization:'Bearer '+token}});
      if(cres.ok){const c=await cres.json();
        if(Array.isArray(c.divisiones)&&c.divisiones.length)S.catalogos.divisiones=c.divisiones.map(String);
        if(Array.isArray(c.tiposTransferencia)&&c.tiposTransferencia.length)S.catalogos.tiposTransferencia=c.tiposTransferencia.map(String);
      }
    }catch(e2){}
  }catch(e){}
}

const HK=new Set(B.naftaKeys);
const nKey=r=>`${r[0]}|${timeStr(r[1])}|${String(r[3]).toUpperCase().trim()}|${(+r[10]||0).toFixed(2)}`;
function allNKeys(){const s=new Set(HK);Object.values(S.nup).forEach(U=>U.rows.forEach(r=>s.add(nKey(r))));return s}
/** Período de una carga = quincena de la fecha de operación (no el período elegido al subir). */
const rowPer=r=>{const f=String(r&&r[0]||'').slice(0,10);return f?perOf(f):''};
function naftaPeriodos(){
  const s=new Set(Object.keys(S.nhist||{}));
  Object.values(S.nup).forEach(U=>(U.rows||[]).forEach(r=>{const p=rowPer(r);if(p)s.add(p)}));
  return [...s].sort().reverse();
}
/* nafta groups: período por fecha de carga.
   pend = cargas con fecha en quincena <= p y NO liquidadas (nunca se re-sugieren).
   per  = cargas cuya fecha cae en p (para consulta del módulo Nafta). */
function naftaGroups(p,mode){const m={};
  Object.values(S.nup).forEach(U=>{(U.rows||[]).forEach((r,i)=>{
    const ref=U.id+':'+i,rp=rowPer(r);if(!rp)return;
    if(mode==='pend'){if(rp>p)return;if(D.nLiq[ref])return}
    else{if(rp!==p)return}
    const pat=String(r[3]).toUpperCase().trim(),o=ownerOf(pat,r[0]),t=tipoComb(r[6]),k=norm(o)+'|'+pat+'|'+t;
    const x=m[k]||(m[k]={empresa:o,patente:pat,tipo:t,cargas:0,litros:0,importe:0,refs:[],periodos:new Set(),liq:new Set()});
    x.cargas++;x.litros+=+r[9]||0;x.importe+=+r[10]||0;x.refs.push(ref);x.periodos.add(rp);

/* pending calc for one empresa in period p; ov = {exA:[], exT:[], exL:[], hs:{}} */
function calcEmp(p,k,ov,cache){
  ov=ov||{};const exA=new Set(ov.exA||[]),exT=new Set(ov.exT||[]),exL=new Set(ov.exL||[]),exN=new Set(ov.exN||[]);
  const r={periodo:p,k,empresa:(EI()[k]||{}).nombre||NM[k]||k,fact:0,viajes:0,factRows:[],nafta:[],adel:[],tal:[],prest:[]};
  let factRukas=0;
  (S.fact[p]||[]).forEach(f=>{
    if(norm(f.empresa)!==k)return;
    r.fact+=+f.importe||0;
    r.factRows.push(f);
    if(f.manual)return;
    r.viajes+=+f.viajes||0;
    factRukas+=+f.importe||0;
  });
  (cache?cache.nafta:naftaGroups(p,'pend')).forEach(n=>{if(norm(n.empresa)===k)r.nafta.push({...n,inc:!exN.has(n.key)})});
  Object.values(S.adel).forEach(a=>{if(a.deleted||norm(a.empresa)!==k)return;const amin=adelMinPer(a.fecha);a.cuotas.forEach(c=>{if(c.periodo<amin)return;if(c.periodo<=p&&!D.cuotaLiq[a.id+'#'+c.n]){const key=a.id+'#'+c.n;r.adel.push({id:a.id,n:c.n,de:a.cuotas.length,fecha:a.fecha,tipo:a.tipo,desc:a.desc,periodo:c.periodo,importe:+c.importe,key,inc:!exA.has(key)})}})});
  Object.values(S.tal).forEach(t=>{if(norm(t.empresa)===k&&t.fecha<=pEnd(p)&&!D.talLiq[t.id])r.tal.push({...t,inc:!exT.has(t.id)})});
  const vh=vhEmp(k,pStart(p));
  Object.values(S.prest).forEach(l=>{if(norm(l.empresa)!==k||loanEstado(l)!=='Activo'||l.fecha>pEnd(p))return;const ac=loanAcum(l),saldo=Math.max(0,l.totalHs-ac);if(saldo<=0.0001)return;
    const h=ov.hs&&ov.hs[l.id]!=null?+ov.hs[l.id]:Math.min(l.cuotaHs,saldo);r.prest.push({id:l.id,concepto:l.concepto,horas:h,vh,importe:h*vh,acum:ac,total:l.totalHs,inc:!exL.has(l.id)})});
  const inc=x=>x.filter(i=>i.inc);
  const nI=inc(r.nafta);r.naftaT=sum(nI,'importe');r.gnc=sum(nI.filter(n=>n.tipo==='GNC'),'importe');r.naf=r.naftaT-r.gnc;
  r.adelT=sum(inc(r.adel),'importe');r.talT=sum(inc(r.tal),'importe');r.prestT=sum(inc(r.prest),'importe');r.desc=r.naftaT+r.adelT+r.talT+r.prestT;r.saldo=r.fact-r.desc;r.vh=vh;r.horas=vh?factRukas/vh:0;
  return r;
}
function preview(p){
  const cache={nafta:p>=B.PEND?naftaGroups(p,'pend'):[]};const keys=new Set();
  (S.fact[p]||[]).forEach(f=>keys.add(norm(f.empresa)));
  cache.nafta.forEach(n=>n.empresa&&keys.add(norm(n.empresa)));
  Object.values(D.rec).forEach(r=>{if(r.periodo===p)keys.add(r.k)});
  if(p>=B.PEND){
    Object.values(S.adel).forEach(a=>{if(!a.deleted&&a.cuotas.some(c=>c.periodo<=p&&!D.cuotaLiq[a.id+'#'+c.n]))keys.add(norm(a.empresa))});
    Object.values(S.tal).forEach(t=>{if(t.fecha<=pEnd(p)&&!D.talLiq[t.id])keys.add(norm(t.empresa))});
    Object.values(S.prest).forEach(l=>{if(loanEstado(l)==='Activo'&&l.fecha<=pEnd(p)&&!loanFin(l))keys.add(norm(l.empresa))});

function closeEmp(p,k,ov,modo,extra){
  // No sobrescribir liquidaciones ya cerradas: hay que reabrir primero.
  if(closedRec(p,k)){toast('Esa liquidación ya está cerrada: reabrila antes de volver a liquidar');return null}
  const r=calcEmp(p,k,ov);const keep=x=>x.filter(i=>i.inc).map(i=>{const y={...i};delete y.inc;return y});
  // Control estricto: no se cierra en negativo salvo conversión a adelanto.
  if(r.saldo<-0.5&&!(extra&&extra.saldoConvertido>0)){
    toast('No se puede cerrar en negativo');return null;
  }
  const rec={periodo:p,k,empresa:r.empresa,modo,fact:r.fact,viajes:r.viajes,factRows:r.factRows,nafta:keep(r.nafta).map(n=>({empresa:n.empresa,patente:n.patente,tipo:n.tipo,cargas:n.cargas,litros:n.litros,importe:n.importe,refs:n.refs,periodos:n.periodos})),adel:keep(r.adel),tal:keep(r.tal),prest:keep(r.prest).map(x=>({...x,acumDespues:x.acum+x.horas})),
    ef:0,tr:0,pagado:false,fechaPago:'',cerrada:today()};
  finish(rec);

    rec.saldoBruto=rec.saldo;
    rec.saldoConvertido=Math.round(extra.saldoConvertido);
    rec.adelantoConvertidoId=extra.adelantoId||'';
    rec.saldo=0;
  }
  if(rec.saldo<-0.5){toast('No se puede cerrar en negativo');return null}

}
/** Saldo negativo → nuevo adelanto (cuotas desde la quincena siguiente) y cierra la liquidación en $0. */
function convertirNegativoYCerrar(p,k,ov,nCuotas){
  const r=calcEmp(p,k,ov);
  if(!(r.saldo<-0.5))return 'El saldo no es negativo.';
  const monto=Math.round(Math.abs(r.saldo));
  if(!(monto>0))return 'Monto inválido.';
  const n=Math.max(1,Math.min(36,Math.round(+nCuotas||1)));
  const base=Math.floor(monto/n),resto=monto-base*n;
  const cuotas=[];let per=pNext(p);
  for(let i=0;i<n;i++){
    cuotas.push({n:i+1,periodo:per,importe:base+(i===n-1?resto:0)});
    per=pNext(per);
  }
  const tipoNom='Saldo liquidación';
  if(!S.tipos.some(t=>norm(t.nombre)===norm(tipoNom))){S.tipos.push({nombre:tipoNom,activo:true});saveCfg('tipos')}
  const adel={
    id:uid('n'),fecha:today(),empresa:r.empresa,tipo:tipoNom,
    desc:`Conversión saldo negativo · ${pLabel(p)}`,
    patente:'',importe:monto,cuotas,
    origenLiq:p+'|'+k
  };
  S.adel[adel.id]=adel;saveAdel(adel);
  const closed=closeEmp(p,k,ov,'individual',{saldoConvertido:monto,adelantoId:adel.id});
  if(!closed){delete S.adel[adel.id];persist('adel/'+adel.id,null);return 'No se pudo cerrar la liquidación.';}
  return null;
}

function registrarPago(k,fecha){const r=D.rec[k];if(!r||r.pagado||r.modo==='historico')return false;const ef=UI.efDraft[k]!=null?+UI.efDraft[k]:0;if(!(ef>=0&&ef<=r.saldo+0.5))return false;

function catDivForm(){

/** En Mi Vettore el iframe es tan alto como el contenido y scrollea el <main> padre:
 *  position:fixed del modal queda arriba, fuera de vista. Anclar al tramo visible. */
function overlayView(){
  try{
    const f=window.frameElement;if(!f)return null;
    const r=f.getBoundingClientRect();
    const ph=window.parent.innerHeight||0;if(!ph)return null;
    const top=Math.max(0,-r.top);
    const vis=Math.min(r.bottom,ph)-Math.max(r.top,0);
    return{top,height:Math.max(280,vis)};
  }catch(e){return null}
}
function clearOverlayPin(el){
  if(!el)return;
  ['position','left','right','top','bottom','width','height','inset','transform','zIndex'].forEach(k=>{el.style[k]=''});
}
function pinOverlay(el,kind){
  if(!el)return;
  const v=overlayView();
  if(!v){clearOverlayPin(el);return}
  el.style.position='absolute';
  el.style.zIndex=kind==='toast'?'60':(kind==='drawer'||kind==='ov'?'21':'40');
  if(kind==='toast'){
    el.style.left='50%';el.style.transform='translateX(-50%)';
    el.style.top=(v.top+v.height-72)+'px';el.style.bottom='auto';
    el.style.right='auto';el.style.width='';el.style.height='';
    return;
  }
  el.style.top=v.top+'px';el.style.height=v.height+'px';el.style.bottom='auto';el.style.inset='auto';
  if(kind==='drawer'){el.style.left='auto';el.style.right='0';el.style.width='min(740px, 96vw)'}
  else{el.style.left='0';el.style.right='0';el.style.width='100%'}
}
function refreshOpenOverlays(){

function serialToISO(v){if(v==null||v==='')return null;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${pad(d.m)}-${pad(d.d)}`:null}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${pad(m[2])}-${pad(m[1])}`}return null}
function timeStr(v){if(typeof v==='number'){const t=Math.round((v%1)*86400);return `${pad(Math.floor(t/3600))}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`}const m=String(v||'').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?`${pad(m[1])}:${m[2]}:${m[3]||'00'}`:String(v||'')}
const num=v=>{if(typeof v==='number')return v;if(v==null)return 0;let s=String(v).replace(/[$\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');else s=s.replace(/,/g,'');return +s||0};
function findHeader(rows,test){for(let i=0;i<Math.min(rows.length,60);i++){if(test((rows[i]||[]).map(norm)))return i}return -1}

async function importNafta(file){

  const Hn=sh.rows[h].slice(0,14).map(norm),iF=Hn.indexOf('fecha'),iP=Hn.indexOf('placa'),iM=Hn.findIndex(c=>/^m\.?n\.?$/.test(c)),iH=Hn.indexOf('hora');if(iM<0){toast('No se encontró la columna M.N.');return}

     saveNup(id);UI.naftaP=top||UI.naftaP;toast(`${rows.length} cargas · período según fecha de operación`);

const safeFile=s=>String(s||'export').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,80);
async function downloadXlsx(fname,sheets){
  const wb=XLSX.utils.book_new();
  (sheets||[]).forEach(({name,rows,cols})=>{
    const w=XLSX.utils.json_to_sheet(rows&&rows.length?rows:[{'(sin datos)':''}]);
    if(cols)w['!cols']=cols;else{
      const keys=rows&&rows[0]?Object.keys(rows[0]):[];
      w['!cols']=keys.map(k=>({wch:Math.min(40,Math.max(12,String(k).length+2))}));
    }
    XLSX.utils.book_append_sheet(wb,w,String(name||'Hoja').slice(0,31));
  });
  const blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let DL=null;try{DL=await claude.use('downloads')}catch(e){}
  try{if(DL)await DL.save({filename:fname,data:blob});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}toast('Excel exportado')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar ('+(e.code||'error')+')')}
}

  if(mod==='fact'){
    const p=UI.factP,rows=(S.fact[p]||[]).map(f=>{const k=norm(f.empresa),vh=vhEmp(k,pStart(p));return {...f,vh,horas:!f.manual&&vh?f.importe/vh:0,liq:!!closedRec(p,k)}}).sort((a,b)=>a.empresa.localeCompare(b.empresa,'es',{sensitivity:'base'})||(!!a.manual)-(!!b.manual));
    const out=rows.map(r=>({'Período':pLabel(p),'Empresa':r.empresa,'Tipo':r.manual?'Adicional / ajuste':'Rukas','Concepto / archivo':r.manual?(r.concepto||''):(r.archivo||''),'Viajes':r.manual?'':(r.viajes||0),'Horas':r.manual?'':(r.vh?Math.round(r.horas*10)/10:''),'Importe':Math.round(r.importe||0),'Estado':r.liq?'Liquidada':'Pendiente'}));
    await downloadXlsx(`Facturacion_${safeFile(pLabel(p))}.xlsx`,[{name:'Facturación',rows:out}]);return;
  }
  if(mod==='nafta'){
    const pers=naftaPeriodos();const p=UI.naftaP&&pers.includes(UI.naftaP)?UI.naftaP:pers[0];
    if(!p){toast('No hay nafta para exportar');return}
    const hist=!!S.nhist[p]&&!Object.values(S.nup).some(u=>(u.rows||[]).some(r=>rowPer(r)===p));
    const G=hist?S.nhist[p].map(([e,pat,t,c,l,i])=>({empresa:e,patente:pat,tipo:t,cargas:c,litros:l,importe:i,refs:[]})):naftaGroups(p,'per');
    const byEmp=[];const by={};G.forEach(g=>{const k=g.empresa||'(sin empresa)';(by[k]=by[k]||[]).push(g)});
    Object.keys(by).sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'})).forEach(k=>{
      const gs=by[k];byEmp.push({'Empresa':k,'Cargas':sum(gs,'cargas'),'Importe':Math.round(sum(gs,'importe'))});
    });
    const det=G.slice().sort((a,b)=>(a.empresa||'').localeCompare(b.empresa||'','es')||a.patente.localeCompare(b.patente)||a.tipo.localeCompare(b.tipo)).map(g=>{
      const refs=g.refs||[];const allLiq=refs.length&&refs.every(r=>D.nLiq[r]);
      return {'Período':pLabel(p),'Empresa':g.empresa||'','Patente':g.patente,'Tipo':g.tipo,'Cargas':g.cargas,'Importe':Math.round(g.importe||0),'Estado':hist||allLiq?'Liquidado':'Pendiente'};
    });
    const lines=[];
    if(!hist)G.forEach(g=>{(g.refs||[]).forEach(ref=>{const r=naftaRaw(ref);if(!r)return;lines.push({'Período':pLabel(p),'Empresa':g.empresa||'','Patente':g.patente,'Tipo':tipoComb(r[6]),'Fecha':r[0],'Hora':r[1]||'','Estación':r[12]||'','Producto':r[6]||'','Litros':+(+r[9]||0).toFixed(2),'Importe':Math.round(+r[10]||0),'Estado':D.nLiq[ref]?'Liquidado · '+pLabel(D.nLiq[ref]):'Pendiente'})})});
    const sheets=[{name:'Por empresa',rows:byEmp},{name:'Por patente',rows:det}];
    if(lines.length)sheets.push({name:'Cargas',rows:lines});
    await downloadXlsx(`Nafta_${safeFile(pLabel(p))}.xlsx`,sheets);return;
  }
  if(mod==='pago'){
    let L=Object.values(D.rec).filter(r=>r.modo!=='historico'&&r.saldo>0);
    if(UI.payF==='pend')L=L.filter(r=>!r.pagado);else if(UI.payF==='pag')L=L.filter(r=>r.pagado);
    if(UI.payP)L=L.filter(r=>r.periodo===UI.payP);
    const s=norm(UI.search);if(s)L=L.filter(r=>norm(r.empresa).includes(s));
    L.sort((a,b)=>a.periodo.localeCompare(b.periodo)||a.empresa.localeCompare(b.empresa,'es',{sensitivity:'base'}));
    const out=L.map(r=>{const e=EI()[r.k]||{};return {'Período':pLabel(r.periodo),'Empresa':r.empresa,'Tipo transferencia':e.tipoTransferencia||'','Saldo':Math.round(r.saldo||0),'Efectivo':Math.round(r.ef||0),'Transferencia':Math.round(r.tr||(r.pagado?0:r.saldo)||0),'Fecha pago':r.fechaPago||'','Estado':r.pagado?'Pagada':'Pendiente'}});
    await downloadXlsx('Pagos.xlsx',[{name:'Pagos',rows:out}]);return;
  }
  if(mod==='vh'){
    const f=UI.vhRef||today(),cur=cuadroVig(f);
    const cuadro=cur.map(x=>({'División':x.d,'Valor hora':x.v?Math.round(x.v.valor):'','Desde':x.v?x.v.desde:'','Hasta':x.v?(x.v.hasta||'abierta'):'','Empresas':S.empresas.filter(e=>e.division===x.d).length}));
    const emps=S.empresas.map(e=>{const v=(cur.find(c=>c.d===e.division)||{}).v;return {'Empresa':e.nombre,'División':e.division||'','Tipo transferencia':e.tipoTransferencia||'','Valor hora':v?Math.round(v.valor):''}});
    const hist=S.valores.slice().sort((a,b)=>a.division.localeCompare(b.division)||(b.desde||'').localeCompare(a.desde||'')).map(v=>({'División':v.division,'Valor':Math.round(v.valor),'Desde':v.desde||'','Hasta':v.hasta||'abierta'}));
    await downloadXlsx(`Valores_hora_${safeFile(f)}.xlsx`,[{name:'Cuadro vigente',rows:cuadro},{name:'Empresas',rows:emps},{name:'Historia',rows:hist}]);return;
  }
  if(mod==='cat'){
    const divs=(S.catalogos.divisiones||[]).map(d=>({'División':d,'Empresas':S.empresas.filter(e=>e.division===d).length}));
    const tipos=(S.catalogos.tiposTransferencia||[]).map(t=>({'Tipo':labelTipoCat(t),'Empresas':S.empresas.filter(e=>(e.tipoTransferencia||'')===(t==='Clasica'?'Clásica':t)||e.tipoTransferencia===t).length}));
    await downloadXlsx('Catalogos.xlsx',[{name:'Divisiones',rows:divs},{name:'Tipos transferencia',rows:tipos}]);return;
  }
  toast('Nada para exportar en este módulo');
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.dataset.ch||el.dataset.in||el.disabled)return;
  const a=el.dataset.a,k=el.dataset.k,id=el.dataset.id;
  switch(a){
    case 'mod':UI.mod=k;UI.search='';UI.det=null;closeDrawer();document.getElementById('modal').classList.remove('on');try{window.__vtNotifyLiqMod&&window.__vtNotifyLiqMod(k)}catch(e){}render();scrollTo(0,0);break;
    case 'role':UI.role=k;try{localStorage.setItem('vt_role',k)}catch(e){}render();break;
    case 'mclose':document.getElementById('modal').classList.remove('on');break;
    case 'reset':confirmBox('Restaurar datos de ejemplo','Se borran todos los datos guardados y se vuelve a la historia del Excel.',resetAll,'Restaurar');break;
    case 'newAdel':adelForm();break;
    case 'editAdel':adelForm(S.adel[id]);break;
    case 'delAdel':confirmBox('Eliminar adelanto','¿Eliminar este adelanto?',()=>{const x=S.adel[id];x.deleted=true;saveAdel(x)},'Eliminar');break;
    case 'adelF':UI.adelF=k;render();break;
    case 'newLoan':loanForm();break;
    case 'editLoan':{const L=S.prest[id];if(!L)break;if(loanEstado(L)==='Finalizado'){toast('Préstamo finalizado: no se puede editar');loanHist(L);break}loanForm(L);break}
    case 'histLoan':loanHist(S.prest[id]);break;
    case 'prestF':UI.prestF=k;render();break;
    case 'pick':pickKind=el.dataset.kind;const fi=document.getElementById('fileIn');fi.value='';fi.click();break;
    case 'delNup':confirmBox('Borrar subida de nafta',`Se elimina la subida "${esc(S.nup[k].archivo)}" (${S.nup[k].rows.length} cargas imputadas a ${pLabel(S.nup[k].periodo)}). Solo un administrador puede hacerlo.`,()=>{delete S.nup[k];saveNup(k);toast('Subida borrada')},'Borrar');break;
    case 'tipos':tiposForm();break;
    case 'catDivForm':catDivForm();break;
    case 'catTipoForm':catTipoForm();break;
    case 'newFactAjuste':factAjusteForm();break;
    case 'editFactAjuste':{const x=(S.fact[UI.factP]||[]).find(f=>f.id===id&&f.manual);if(x)factAjusteForm(x);break}
    case 'delFactAjuste':{const x=(S.fact[UI.factP]||[]).find(f=>f.id===id&&f.manual);if(!x)break;if(closedRec(UI.factP,norm(x.empresa))){toast('Empresa ya liquidada');break}
      confirmBox('Eliminar adicional / ajuste',`¿Eliminar <b>${esc(x.concepto||'')}</b> de <b>${esc(x.empresa)}</b> (${fm(x.importe)})?`,()=>{S.fact[UI.factP]=(S.fact[UI.factP]||[]).filter(f=>f.id!==id);saveFact(UI.factP);toast('Ajuste eliminado')},'Eliminar');break}
    case 'det':UI.det=k;render();scrollTo(0,0);break;
    case 'openDet':UI.det=[...UI.sel][0];render();scrollTo(0,0);break;
    case 'backPrev':UI.det=null;render();break;
    case 'massClose':massClose();break;
    case 'toPago':UI.mod='pago';UI.payF='pend';UI.payP=k.split('|')[0];UI.search='';UI.det=null;try{window.__vtNotifyLiqMod&&window.__vtNotifyLiqMod('pago')}catch(e){}render();break;
    case 'payF':UI.payF=k;render();break;
    case 'paySelAll':{const s=norm(UI.search);Object.values(D.rec).filter(r=>r.modo!=='historico'&&r.saldo>0&&!r.pagado&&(!UI.payP||r.periodo===UI.payP)&&(!s||norm(r.empresa).includes(s))).forEach(r=>UI.paySel.add(r.periodo+'|'+r.k));render();break}
    case 'paySelNone':UI.paySel=new Set();render();break;
    case 'efAll':UI.efDraft[k]=Math.round(D.rec[k].saldo);render();break;
    case 'efNone':UI.efDraft[k]=0;render();break;
    case 'payOne':{const r=D.rec[k];const ef=UI.efDraft[k]!=null?+UI.efDraft[k]:0;confirmBox('Registrar pago · '+esc(r.empresa),`${pLabel(r.periodo)} · saldo <b>${fm(r.saldo)}</b><br>Efectivo <b>${fm(ef)}</b> · Transferencia <b>${fm(r.saldo-ef)}</b> · Fecha ${fD(UI.fpDraft[k]||today())}`,()=>{registrarPago(k,UI.fpDraft[k]);toast('Pago registrado')},'Registrar pago');break}
    case 'payMany':{const ks=[...UI.paySel],bad=ks.filter(x=>{const r=D.rec[x],t=UI.efDraft[x]!=null?+UI.efDraft[x]:0;return !(t>=0&&t<=r.saldo+0.5)});if(bad.length){toast('Hay montos de efectivo inválidos en la selección.');return}
      const tot=sum(ks.map(x=>D.rec[x]),'saldo'),efT=sum(ks,x=>UI.efDraft[x]!=null?+UI.efDraft[x]:0);
      confirmBox(`Registrar ${ks.length} pago(s)`,`Total <b>${fm(tot)}</b> · Efectivo <b>${fm(efT)}</b> · Transferencia <b>${fm(tot-efT)}</b> · Fecha ${fD(UI.payFecha||today())}`,()=>{let n=0;ks.forEach(x=>{if(registrarPago(x,UI.payFecha||today()))n++});toast(n+' pago(s) registrado(s)')},'Registrar pagos');break}
    case 'payUndo':{const c=S.liq[k];confirmBox('Anular pago · '+esc(c.empresa),'La liquidación vuelve a quedar pendiente de pago.',()=>{c.pagado=false;c.fechaPago='';c.ef=0;c.tr=0;saveLiq(c);toast('Pago anulado')},'Anular');break}
    case 'selOk':UI.sel=new Set(preview(UI.p).list.filter(r=>!r.closed&&r.saldo>=0).map(r=>r.k));render();break;
    case 'selNone':UI.sel=new Set();render();break;
    case 'closeOne':{const p=UI.p,key=p+'|'+UI.det,r=calcEmp(p,UI.det,UI.ov[key]);
      if(r.saldo<-0.5){toast('No se puede cerrar en negativo: convertí el saldo en adelanto o destildá conceptos');break}
      confirmBox('Cerrar liquidación · '+esc(r.empresa),`Saldo <b>${fm(r.saldo)}</b>. El pago se registra después en el módulo Pago.<br>Se descuentan ${r.nafta.filter(x=>x.inc).length} grupo(s) de nafta, ${r.adel.filter(x=>x.inc).length} cuota(s) de adelantos y ${r.prest.filter(x=>x.inc).length} cuota(s) de préstamos. Lo destildado queda pendiente.`,()=>{if(!closeEmp(p,UI.det,UI.ov[key],'individual'))return;UI.sel.delete(UI.det);toast('Liquidación cerrada')},'Cerrar liquidación');break}
    case 'convertNeg':formConvertirNegativo();break;
    case 'reopenEmp':{const c=closedRec(UI.p,UI.det);if(!c)break;if(c.pagado){toast('Anulá el pago antes de reabrir');break}
      confirmBox('Reabrir liquidación · '+esc(c.empresa),`Las cuotas de adelantos, órdenes de taller y horas de préstamos vuelven a quedar pendientes.${c.saldoConvertido>0?' Si el adelanto generado por la conversión no se debitó, también se elimina.':''}`,()=>{
        if(c.adelantoConvertidoId){const a=S.adel[c.adelantoConvertidoId];if(a&&a.cuotas.every(q=>!D.cuotaLiq[a.id+'#'+q.n])){delete S.adel[a.id];persist('adel/'+a.id,null)}}
        delete S.liq[UI.p+'|'+UI.det];delLiq(c);toast('Liquidación reabierta')},'Reabrir');break}
    case 'toggleVhList':UI.vhList=!UI.vhList;render();break;
    case 'naftaEmp':{const s=UI.naftaOpen||(UI.naftaOpen=new Set());s.has(k)?s.delete(k):s.add(k);render();break}
    case 'naftaDet':{const s=UI.naftaDet||(UI.naftaDet=new Set());s.has(k)?s.delete(k):s.add(k);render();break}
    case 'newCuadro':newCuadroForm();break;
    case 'editVh':vhForm(S.valores.find(v=>v.id===id));break;
    case 'delVh':confirmBox('Eliminar valor','¿Eliminar este registro?',()=>{S.valores=S.valores.filter(v=>v.id!==id);saveCfg('valores')},'Eliminar');break;
    case 'panelMode':UI.panelMode=k;render();break;
    case 'export':exportCurrent(k);break;
    case 'open':UI.drawer=[el.dataset.p,k];renderDrawer();break;
    case 'closeDrawer':closeDrawer();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-ch]');if(!el)return;const a=el.dataset.a,key=UI.p+'|'+UI.det;
  const ov=UI.ov[key];const tg=(arr,v,on)=>{const s=new Set(arr);on?s.delete(v):s.add(v);return [...s]};
  switch(a){
    case 'adelT':UI.adelT=el.value;break;
    case 'factP':UI.factP=el.value;break;
    case 'pp':{const [y,m,h]=UI.p.split('-');const v={y,m,h};v[el.dataset.f]=el.value;UI.p=clampLiqPeriod(`${v.y}-${pad(+v.m)}-${v.h}`);UI.sel=new Set();break}
    case 'showAll':UI.showAll=el.checked;break;
    case 'selRow':el.checked?UI.sel.add(el.dataset.k):UI.sel.delete(el.dataset.k);break;
    case 'selAll':{const {list}=preview(UI.p);UI.sel=el.checked?new Set(list.filter(r=>!r.closed&&r.saldo>=0).map(r=>r.k)):new Set();break}
    case 'exA':ov.exA=tg(ov.exA,el.dataset.id,el.checked);break;
    case 'exT':ov.exT=tg(ov.exT,el.dataset.id,el.checked);break;
    case 'exL':ov.exL=tg(ov.exL,el.dataset.id,el.checked);break;
    case 'exN':ov.exN=tg(ov.exN||[],el.dataset.id,el.checked);break;
    case 'naftaP':UI.naftaP=el.value;break;
    case 'payP':UI.payP=el.value;break;
    case 'paySel':el.checked?UI.paySel.add(el.dataset.k):UI.paySel.delete(el.dataset.k);break;
    case 'efIn':{const r=D.rec[el.dataset.k],v=+el.value;if(el.value===''||v<0||v>r.saldo+0.5){UI.efDraft[el.dataset.k]=el.value===''?-1:v;toast(`El efectivo debe estar entre $ 0 y ${fm(r.saldo)}.`)}else UI.efDraft[el.dataset.k]=Math.round(v);break}
    case 'fpIn':UI.fpDraft[el.dataset.k]=el.value;break;
    case 'payFecha':UI.payFecha=el.value;break;
    case 'upP':if(el.dataset.k==='fact'){UI.upFact=el.value;UI.factP=el.value}else{UI.upNafta=el.value;UI.naftaP=el.value}break;
    case 'hsL':ov.hs[el.dataset.id]=Math.max(0,+el.value||0);break;
    case 'vhRef':UI.vhRef=el.value;break;
    case 'empDiv':{const x=EI()[el.dataset.k];if(x){x.division=el.value;saveCfg('divisiones')}break}
    case 'panelP':UI.panelP=el.value;break;
    case 'panelE':UI.panelE=el.value;break;
  }
  rebuild();render();
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;UI.search=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-a="search"]');if(n){n.focus();n.setSelectionRange(pos,pos)}});
document.getElementById('fileIn').addEventListener('change',async e=>{await handleFiles(e.target.files);rebuild();render()});
document.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('hov')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('hov')});
document.addEventListener('drop',async e=>{const d=e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('hov');pickKind=d.dataset.kind;await handleFiles(e.dataTransfer.files);rebuild();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modal').classList.remove('on');closeDrawer()}});
rebuild();render();loadDB();
</script>
</body>
